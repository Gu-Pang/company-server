server:
  port: 19050

spring:
  application:
    name: company-server

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

eureka:
  client:
    register-with-eureka: true # 유레카 서버에 내 주소를 등록함(기본값)
    fetch-registry: true       # 유레카 서버로부터 다른 서비스 주소록을 가져옴(기본값)
    service-url:
      defaultZone: http://localhost:8761/eureka/